<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Physics Formula Sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Spectral:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css" />
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root{--bg:#f5f3ec;--card:#fffdf8;--line:#e5e0d4;--ink:#23262b;--muted:#6c727e;--faint:#9aa0ac;--accent:#7a4bd0;--accent2:#0e7c7b;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px;margin:0 auto;padding:28px 22px 80px}
  header{text-align:center;margin-bottom:24px}
  h1{font-family:'Spectral',serif;font-weight:500;font-size:30px}h1 b{color:var(--accent);font-style:italic;font-weight:500}
  header p{color:var(--muted);font-size:13.5px;margin-top:6px}
  .search-wrap{position:relative;max-width:560px;margin:22px auto 0}
  #search{width:100%;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px 16px 14px 44px;font-family:inherit;font-size:15px;color:var(--ink);outline:none;box-shadow:0 8px 24px -18px rgba(0,0,0,0.3)}
  #search:focus{border-color:var(--accent)}
  .search-wrap svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--faint)}
  .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:18px 0 26px}
  .chip{border:1px solid var(--line);background:var(--card);cursor:pointer;border-radius:20px;padding:7px 15px;font-size:13px;font-weight:500;color:var(--muted);transition:all .15s}
  .chip:hover{border-color:var(--accent)}
  .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .count{text-align:center;font-size:12px;color:var(--faint);margin-bottom:18px}
  .grid{columns:2;column-gap:18px}
  @media(max-width:820px){.grid{columns:1}}
  .card{break-inside:avoid;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:16px 18px;margin-bottom:18px;box-shadow:0 8px 22px -18px rgba(0,0,0,0.3)}
  .card .mod{font-size:10.5px;letter-spacing:1px;text-transform:uppercase;font-weight:600;margin-bottom:8px;color:var(--accent2)}
  .card h3{font-family:'Spectral',serif;font-weight:500;font-size:17px;margin-bottom:10px}
  .formula{background:#faf8f1;border:1px solid var(--line);border-radius:9px;padding:14px 10px;text-align:center;overflow-x:auto;margin-bottom:6px}
  .toggle{font-size:12.5px;color:var(--accent);cursor:pointer;font-weight:600;user-select:none;display:inline-flex;align-items:center;gap:5px;margin-top:8px}
  .toggle:hover{text-decoration:underline}
  .detail{display:none;margin-top:12px;border-top:1px dashed var(--line);padding-top:12px}
  .detail.open{display:block}
  .detail h4{font-size:11px;letter-spacing:0.8px;text-transform:uppercase;color:var(--faint);margin:10px 0 6px;font-weight:600}
  .detail .body{font-size:13.5px;color:#3a3f48;line-height:1.65}
  .detail .body p{margin-bottom:7px}
  .empty{text-align:center;color:var(--faint);font-style:italic;font-family:'Spectral',serif;padding:40px;font-size:16px}
  .loadnote{text-align:center;color:var(--faint);font-size:12px;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Physics <b>Formula Sheet</b></h1>
    <p>Searchable equations across your modules — tap any card for the derivation and a worked example.</p>
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="search" placeholder="Search: 'lorentz', 'entropy', 'schrödinger', 'fresnel'…" autocomplete="off">
    </div>
  </header>
  <div class="chips" id="chips"></div>
  <div class="count" id="count"></div>
  <div class="grid" id="grid"></div>
  <div class="loadnote">Equations render with KaTeX (loads once from the web). Everything else is offline.</div>
</div>

<script>
const F=[
  // ---------- Mechanics & Relativity ----------
  {m:"Mechanics & Relativity",n:"Newton's second law",f:"\\vec F = \\dfrac{d\\vec p}{dt} = m\\vec a",k:"force momentum",
   d:"Defines force as the rate of change of momentum $\\vec p=m\\vec v$. For constant mass it reduces to $\\vec F=m\\vec a$.",
   e:"A 2 kg cart pushed with 6 N accelerates at $a=F/m=3\\,\\text{m/s}^2$."},
  {m:"Mechanics & Relativity",n:"Work–energy theorem",f:"W_{net}=\\Delta K=\\tfrac12 m v_f^2-\\tfrac12 m v_i^2",k:"work kinetic energy",
   d:"Integrate $\\vec F\\cdot d\\vec r$ along the path; using $\\vec F=m\\,d\\vec v/dt$ gives $\\int m\\vec v\\cdot d\\vec v=\\Delta(\\tfrac12 mv^2)$.",
   e:"10 J of net work on a 1 kg body initially at rest gives $v=\\sqrt{2W/m}=\\sqrt{20}\\approx4.5\\,$m/s."},
  {m:"Mechanics & Relativity",n:"Lorentz factor",f:"\\gamma=\\dfrac{1}{\\sqrt{1-v^2/c^2}}",k:"relativity time dilation special",
   d:"Arises from requiring the spacetime interval $c^2t^2-x^2$ to be invariant between inertial frames.",
   e:"At $v=0.6c$, $\\gamma=1/\\sqrt{1-0.36}=1.25$ — clocks run 25% slow."},
  {m:"Mechanics & Relativity",n:"Relativistic energy",f:"E=\\gamma m c^2,\\quad E^2=(pc)^2+(mc^2)^2",k:"relativity rest mass energy",
   d:"From the 4-momentum $p^\\mu=(E/c,\\vec p)$ whose invariant norm is $(mc)^2$.",
   e:"A particle with $pc=mc^2$ has $E=\\sqrt2\\,mc^2$, so $\\gamma=\\sqrt2$."},
  // ---------- Oscillations & Waves ----------
  {m:"Oscillations & Waves",n:"Simple harmonic motion",f:"\\ddot x+\\omega_0^2 x=0,\\quad x(t)=A\\cos(\\omega_0 t+\\phi)",k:"shm spring pendulum oscillation",
   d:"For a restoring force $F=-kx$, Newton's law gives $m\\ddot x=-kx$ with $\\omega_0=\\sqrt{k/m}$.",
   e:"A 0.5 kg mass on a 50 N/m spring oscillates at $\\omega_0=10$ rad/s, $T=2\\pi/\\omega_0\\approx0.63$ s."},
  {m:"Oscillations & Waves",n:"Damped oscillator",f:"\\ddot x+2\\zeta\\omega_0\\dot x+\\omega_0^2x=0",k:"damping quality factor resonance",
   d:"Add a velocity-proportional drag $-b\\dot x$. Solutions decay as $e^{-\\zeta\\omega_0 t}$; under-damped for $\\zeta<1$.",
   e:"Quality factor $Q=1/2\\zeta$; $\\zeta=0.05$ gives $Q=10$ — a fairly sharp resonance."},
  {m:"Oscillations & Waves",n:"Wave equation",f:"\\dfrac{\\partial^2 y}{\\partial t^2}=v^2\\dfrac{\\partial^2 y}{\\partial x^2}",k:"waves speed string",
   d:"Newton's law on a string element under tension $T$ with mass density $\\mu$ gives $v=\\sqrt{T/\\mu}$.",
   e:"A string with $T=100$ N, $\\mu=0.01$ kg/m carries waves at $v=100$ m/s."},
  // ---------- Electromagnetism ----------
  {m:"Electromagnetism",n:"Gauss's law",f:"\\oint \\vec E\\cdot d\\vec A=\\dfrac{Q_{enc}}{\\varepsilon_0}",k:"flux charge maxwell electric",
   d:"Maxwell's first equation in integral form; flux through a closed surface depends only on enclosed charge.",
   e:"A point charge $q$ gives $E=q/(4\\pi\\varepsilon_0 r^2)$ by symmetry over a sphere of radius $r$."},
  {m:"Electromagnetism",n:"Ampère–Maxwell law",f:"\\oint \\vec B\\cdot d\\vec\\ell=\\mu_0\\!\\left(I_{enc}+\\varepsilon_0\\dfrac{d\\Phi_E}{dt}\\right)",k:"magnetic current displacement",
   d:"Ampère's law plus Maxwell's displacement-current term, required for charge conservation.",
   e:"Outside a long wire carrying $I$: $B=\\mu_0 I/(2\\pi r)$."},
  {m:"Electromagnetism",n:"Faraday's law",f:"\\varepsilon=-\\dfrac{d\\Phi_B}{dt}",k:"induction emf flux",
   d:"A changing magnetic flux through a loop induces an EMF opposing the change (Lenz's law sign).",
   e:"A 200-turn coil seeing $d\\Phi_B/dt=0.01$ Wb/s gives $\\varepsilon=200\\times0.01=2$ V."},
  {m:"Electromagnetism",n:"Lorentz force",f:"\\vec F=q(\\vec E+\\vec v\\times\\vec B)",k:"charge magnetic force",
   d:"The total force on a charge in electric and magnetic fields — the bridge between fields and mechanics.",
   e:"A proton at $10^6$ m/s ⟂ a 0.1 T field feels $F=qvB=1.6\\times10^{-14}$ N."},
  // ---------- Thermodynamics & Statistical Physics ----------
  {m:"Thermo & Stat Mech",n:"First law",f:"dU=\\delta Q-\\delta W",k:"energy heat work internal",
   d:"Energy conservation for a system: change in internal energy = heat in minus work done by the system.",
   e:"50 J heat in while doing 20 J of work raises $U$ by 30 J."},
  {m:"Thermo & Stat Mech",n:"Boltzmann entropy",f:"S=k_B\\ln\\Omega",k:"entropy microstates statistical",
   d:"Entropy counts accessible microstates $\\Omega$; maximising $S$ under constraints yields equilibrium.",
   e:"Doubling accessible microstates adds $\\Delta S=k_B\\ln2$ per particle."},
  {m:"Thermo & Stat Mech",n:"Boltzmann distribution",f:"P_i=\\dfrac{e^{-E_i/k_BT}}{Z},\\;\\; Z=\\sum_i e^{-E_i/k_BT}",k:"partition function probability",
   d:"Maximise entropy at fixed average energy (Lagrange multiplier $\\beta=1/k_BT$) over microstate probabilities.",
   e:"Two levels split by $\\Delta E=k_BT$ have population ratio $e^{-1}\\approx0.37$."},
  {m:"Thermo & Stat Mech",n:"Ideal gas law",f:"PV=Nk_BT=nRT",k:"pressure volume temperature gas",
   d:"Follows from kinetic theory: pressure is momentum flux of $N$ free particles in volume $V$.",
   e:"1 mol at 300 K in 0.025 m³ gives $P=nRT/V\\approx10^5$ Pa."},
  // ---------- Quantum Mechanics ----------
  {m:"Quantum Mechanics",n:"Time-dependent Schrödinger eq.",f:"i\\hbar\\dfrac{\\partial\\psi}{\\partial t}=\\hat H\\psi",k:"wavefunction hamiltonian",
   d:"The fundamental equation of motion for the quantum state; $\\hat H$ is the energy operator.",
   e:"Stationary states $\\psi=\\phi(x)e^{-iEt/\\hbar}$ satisfy $\\hat H\\phi=E\\phi$."},
  {m:"Quantum Mechanics",n:"Heisenberg uncertainty",f:"\\Delta x\\,\\Delta p\\ge\\dfrac{\\hbar}{2}",k:"uncertainty commutator position momentum",
   d:"From the commutator $[\\hat x,\\hat p]=i\\hbar$ and the Cauchy–Schwarz inequality on operators.",
   e:"An electron localised to $\\Delta x=0.1$ nm has $\\Delta p\\gtrsim5\\times10^{-25}$ kg·m/s."},
  {m:"Quantum Mechanics",n:"Particle in a box",f:"E_n=\\dfrac{n^2\\pi^2\\hbar^2}{2mL^2}",k:"infinite well energy levels quantisation",
   d:"Solve $-\\tfrac{\\hbar^2}{2m}\\phi''=E\\phi$ with $\\phi(0)=\\phi(L)=0$, giving $\\sin(n\\pi x/L)$ and quantised $E_n$.",
   e:"Levels scale as $1,4,9,\\dots$; the $n{=}2$ state has 4× the ground-state energy."},
  {m:"Quantum Mechanics",n:"de Broglie wavelength",f:"\\lambda=\\dfrac{h}{p}",k:"matter wave momentum",
   d:"Postulates wave behaviour for matter; consistent with the photon relation $p=h/\\lambda$.",
   e:"A 100 eV electron ($p\\approx5.4\\times10^{-24}$) has $\\lambda\\approx0.12$ nm."},
  // ---------- Mathematical Methods ----------
  {m:"Mathematical Methods",n:"Fourier series",f:"f(x)=\\sum_{n=-\\infty}^{\\infty}c_n e^{i n k x},\\; c_n=\\frac1L\\!\\int_0^L\\! f\\,e^{-inkx}dx",k:"harmonics periodic spectrum",
   d:"Any well-behaved periodic function is a sum of orthogonal complex exponentials; coefficients from projection.",
   e:"A square wave contains only odd harmonics with amplitudes $\\propto 1/n$."},
  {m:"Mathematical Methods",n:"Divergence theorem",f:"\\int_V (\\nabla\\cdot\\vec F)\\,dV=\\oint_{\\partial V}\\vec F\\cdot d\\vec A",k:"gauss vector calculus flux",
   d:"Relates volume integral of a divergence to net flux through the boundary — underpins Gauss's law.",
   e:"For $\\vec F=\\vec r$, $\\nabla\\cdot\\vec F=3$, so the integral is $3V$."},
  {m:"Mathematical Methods",n:"Taylor expansion",f:"f(x)=\\sum_{n=0}^{\\infty}\\dfrac{f^{(n)}(a)}{n!}(x-a)^n",k:"series approximation expansion",
   d:"Local polynomial approximation built from successive derivatives at $a$.",
   e:"$e^x\\approx1+x+\\tfrac{x^2}{2}$ near 0; at $x=0.1$ the error is $\\sim10^{-4}$."},
  // ---------- Optics ----------
  {m:"Optics",n:"Thin-lens equation",f:"\\dfrac1f=\\dfrac1{d_o}+\\dfrac1{d_i}",k:"focal length image object",
   d:"From ray geometry with the small-angle (paraxial) approximation for a thin lens.",
   e:"Object at 30 cm with $f=10$ cm images at $d_i=15$ cm ($1/10-1/30$)."},
  {m:"Optics",n:"Double-slit maxima",f:"d\\sin\\theta=m\\lambda",k:"interference diffraction young fringes",
   d:"Constructive interference when the path difference $d\\sin\\theta$ is an integer number of wavelengths.",
   e:"Slits 0.1 mm apart, $\\lambda=500$ nm: first max at $\\sin\\theta=5\\times10^{-3}$."},
  {m:"Optics",n:"Bragg's law",f:"2d\\sin\\theta=n\\lambda",k:"crystal x-ray diffraction lattice",
   d:"Reflections off lattice planes spaced $d$ interfere constructively at the Bragg angle.",
   e:"$d=0.2$ nm, $\\lambda=0.15$ nm: first order at $\\theta\\approx22^\\circ$."},
  // ---------- Nuclear & Particle ----------
  {m:"Nuclear & Particle",n:"Radioactive decay",f:"N(t)=N_0 e^{-\\lambda t},\\; t_{1/2}=\\dfrac{\\ln2}{\\lambda}",k:"half life exponential activity",
   d:"Constant decay probability per nucleus gives $dN/dt=-\\lambda N$ and exponential decay.",
   e:"After 3 half-lives, $N/N_0=(1/2)^3=1/8$ remains."},
  {m:"Nuclear & Particle",n:"Mass–energy of binding",f:"E_b=\\Delta m\\,c^2",k:"binding energy nuclear mass defect",
   d:"The bound nucleus is lighter than its parts; the missing mass is released as binding energy.",
   e:"A mass defect of 1 u releases $\\approx931.5$ MeV."},
];

(function(){
  const grid=document.getElementById("grid"),chipsEl=document.getElementById("chips");
  const mods=[...new Set(F.map(x=>x.m))];
  let active="All", q="";
  const allChips=["All",...mods];
  chipsEl.innerHTML=allChips.map(m=>`<div class="chip${m==="All"?" on":""}" data-m="${m}">${m}</div>`).join("");
  chipsEl.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{active=c.dataset.m;
    chipsEl.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x===c));render();});
  document.getElementById("search").addEventListener("input",e=>{q=e.target.value.toLowerCase();render();});

  function match(x){const inMod=active==="All"||x.m===active;
    const hay=(x.n+" "+x.m+" "+x.k+" "+x.f).toLowerCase();return inMod&&(!q||hay.includes(q));}
  function render(){
    const list=F.filter(match);
    document.getElementById("count").textContent=list.length+" of "+F.length+" formulas";
    if(!list.length){grid.innerHTML='<div class="empty">No formulas match — try another term.</div>';return;}
    grid.innerHTML=list.map((x,i)=>`<div class="card">
      <div class="mod">${x.m}</div><h3>${x.n}</h3>
      <div class="formula">$$${x.f}$$</div>
      <span class="toggle" data-i="${i}">▸ derivation &amp; example</span>
      <div class="detail">
        <h4>Where it comes from</h4><div class="body">${x.d}</div>
        <h4>Worked example</h4><div class="body">${x.e}</div>
      </div></div>`).join("");
    grid.querySelectorAll(".toggle").forEach(t=>t.onclick=()=>{
      const det=t.nextElementSibling;const open=det.classList.toggle("open");
      t.innerHTML=(open?"▾":"▸")+" derivation &amp; example";});
    typeset();
  }
  function typeset(){if(window.renderMathInElement)renderMathInElement(grid,{delimiters:[
    {left:"$$",right:"$$",display:true},{left:"$",right:"$",display:false}]});}
  // wait for KaTeX
  let tries=0;(function w(){if(window.renderMathInElement||tries>40){render();}else{tries++;setTimeout(w,80);}})();
})();
</script>
</body>
</html>
